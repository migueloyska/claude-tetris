<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="dark">
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section theme-toggle">
          <span class="label">LIGHT MODE</span>
          <label class="switch">
            <input type="checkbox" id="theme-switch">
            <span class="switch-slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="name-input-section" class="name-input-section hidden">
          <p class="hs-prompt">¡Nuevo récord! Ingresa tu nombre:</p>
          <div class="name-input-row">
            <input type="text" id="name-input" maxlength="12" placeholder="Nombre" autocomplete="off">
            <button id="save-name-btn">Guardar</button>
          </div>
        </div>

        <div class="highscore-panel">
          <h2 class="hs-heading">RÉCORDS</h2>
          <table class="hs-table" id="overlay-hs-table"></table>
          <div class="hs-stats">
            <div class="panel-section">
              <span class="label">MEJOR COMBO</span>
              <span class="value" id="overlay-best-combo">0</span>
            </div>
            <div class="panel-section">
              <span class="label">LÍNEAS MÁXIMAS</span>
              <span class="value" id="overlay-best-lines">0</span>
            </div>
          </div>
        </div>

        <button id="restart-btn">Reiniciar</button>
        <button id="reset-records-btn" class="secondary-btn">Reiniciar records</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p id="start-title">BIENVENIDO</p>

        <div class="highscore-panel">
          <h2 class="hs-heading">RÉCORDS</h2>
          <table class="hs-table" id="start-hs-table"></table>
          <div class="hs-stats">
            <div class="panel-section">
              <span class="label">MEJOR COMBO</span>
              <span class="value" id="start-best-combo">0</span>
            </div>
            <div class="panel-section">
              <span class="label">LÍNEAS MÁXIMAS</span>
              <span class="value" id="start-best-lines">0</span>
            </div>
          </div>
        </div>

        <button id="play-btn">Jugar</button>
        <button id="reset-records-btn-start" class="secondary-btn">Reiniciar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
